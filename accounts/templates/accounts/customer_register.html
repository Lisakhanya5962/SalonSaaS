
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Registration | SalonSaaS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">

                    <h1 class="text-center mb-2">
                        Create Customer Account
                    </h1>

                    <p class="text-center text-muted mb-4">
                        Register with
                        <strong>{{ business.name }}</strong>
                    </p>


                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}


                    <form method="post">

                        {% csrf_token %}


                        <h5 class="mb-3">
                            Personal Information
                        </h5>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="first_name"
                                    class="form-label"
                                >
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    name="first_name"
                                    id="first_name"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    for="last_name"
                                    class="form-label"
                                >
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    name="last_name"
                                    id="last_name"
                                    class="form-control"
                                    required
                                >

                            </div>

                        </div>


                        <div class="mb-3">

                            <label
                                for="phone"
                                class="form-label"
                            >
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                id="phone"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <hr>


                        <h5 class="mb-3">
                            Login Information
                        </h5>


                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label
                                for="password_confirmation"
                                class="form-label"
                            >
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="password_confirmation"
                                id="password_confirmation"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100 py-2"
                        >
                            Register as Customer
                        </button>


                    </form>


                    <div class="text-center mt-4">

                        <a href="{% url 'login' %}">
                            Already have an account? Sign in
                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
