
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SalonSaaS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">

                    <h1 class="text-center mb-2">
                        Welcome Back
                    </h1>

                    <p class="text-center text-muted mb-4">
                        Sign in to your SalonSaaS account
                    </p>


                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}


                    <!-- ================================================= -->
                    <!-- EXISTING LOGIN -->
                    <!-- ================================================= -->

                    <form method="post">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-dark w-100 py-2"
                        >
                            Sign In
                        </button>

                    </form>


                    <div class="text-center my-4">

                        <span class="text-muted">
                            OR
                        </span>

                    </div>


                    <!-- ================================================= -->
                    <!-- CUSTOMER REGISTRATION -->
                    <!-- ================================================= -->

                    <div class="text-center">

                        <p class="mb-2">
                            Are you a customer?
                        </p>

                        <a
                            href="{% url 'customer_businesses' %}"
                            class="btn btn-outline-primary w-100 py-2"
                        >
                            Register as Customer
                        </a>

                    </div>


                    <p class="text-center mt-4 mb-0">

                        Business owner?

                        <a href="{% url 'register' %}">
                            Create a business account
                        </a>

                    </p>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
